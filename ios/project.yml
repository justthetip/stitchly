name: Stitchly
options:
  bundleIdPrefix: com.lukejeffproduct
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: GJR42FB3HW
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 32
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    exactVersion: 12.17.0
targets:
  Stitchly:
    type: application
    platform: iOS
    sources:
      - path: Stitchly
      - path: GoogleService-Info.plist
        buildPhase: resources
    info:
      path: Stitchly/Info.plist
      properties:
        CFBundleDisplayName: Stitchly
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        NSCameraUsageDescription: Take private photos of your project at each pattern step.
        NSPhotoLibraryUsageDescription: Choose a project photo to attach privately to the current pattern step.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukejeffproduct.stitchly
        PRODUCT_NAME: Stitchly
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Stitchly/Stitchly.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: com.lukejeffproduct.stitchly AppStore
    dependencies:
      - package: Firebase
        product: FirebaseAnalyticsCore
    scheme:
      testTargets: [StitchlyTests, StitchlyUITests]
  StitchlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StitchlyTests]
    dependencies:
      - target: Stitchly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukejeffproduct.stitchly.tests
        GENERATE_INFOPLIST_FILE: true
  StitchlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [StitchlyUITests]
    dependencies:
      - target: Stitchly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukejeffproduct.stitchly.uitests
        GENERATE_INFOPLIST_FILE: true
