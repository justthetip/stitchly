name: Stitchly
options:
  bundleIdPrefix: com.lukejeffproduct
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: GJR42FB3HW
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.0
    CODE_SIGN_STYLE: Automatic
targets:
  Stitchly:
    type: application
    platform: iOS
    sources: [Stitchly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukejeffproduct.stitchly
        PRODUCT_NAME: Stitchly
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Stitchly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: Stitchly/Stitchly.entitlements
    scheme:
      testTargets: [StitchlyTests]
  StitchlyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StitchlyTests]
    dependencies:
      - target: Stitchly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lukejeffproduct.stitchly.tests
        GENERATE_INFOPLIST_FILE: true
